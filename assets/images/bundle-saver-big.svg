<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="باقة التوفير الكبرى: دجاج طازج وأرز بسمتي">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbf7"/>
      <stop offset="1" stop-color="#cfe9d9"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a5f"/>
      <stop offset="1" stop-color="#0b4a34"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ecd0"/>
      <stop offset="1" stop-color="#e3cb96"/>
    </linearGradient>
    <linearGradient id="chick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a86a"/>
      <stop offset="1" stop-color="#c9772f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b4a34" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="360" r="290" fill="#ffffff" opacity="0.55"/>

  <!-- Rice bag -->
  <g filter="url(#soft)">
    <rect x="470" y="300" width="220" height="320" rx="26" fill="url(#bag)"/>
    <rect x="490" y="270" width="180" height="60" rx="18" fill="#d9bd83"/>
    <rect x="500" y="380" width="160" height="150" rx="16" fill="#fffaf0" stroke="#d9bd83" stroke-width="4"/>
    <text x="580" y="440" text-anchor="middle" font-family="Cairo, Tahoma, sans-serif" font-size="34" font-weight="800" fill="#0f5c42">أرز</text>
    <text x="580" y="486" text-anchor="middle" font-family="Cairo, Tahoma, sans-serif" font-size="26" font-weight="700" fill="#8a6d33">بسمتي</text>
    <text x="580" y="518" text-anchor="middle" font-family="Cairo, Tahoma, sans-serif" font-size="22" font-weight="700" fill="#8a6d33">10 كغ</text>
  </g>

  <!-- Chicken box -->
  <g filter="url(#soft)">
    <rect x="110" y="400" width="300" height="230" rx="24" fill="url(#box)"/>
    <rect x="110" y="400" width="300" height="52" rx="24" fill="#0a3a29"/>
    <text x="260" y="436" text-anchor="middle" font-family="Cairo, Tahoma, sans-serif" font-size="26" font-weight="800" fill="#b6f26b">دجاج طازج</text>

    <!-- Drumsticks -->
    <g transform="translate(175,470)">
      <ellipse cx="0" cy="0" rx="46" ry="34" fill="url(#chick)"/>
      <rect x="34" y="-9" width="60" height="18" rx="9" fill="#f3ead9"/>
      <circle cx="98" cy="-9" r="12" fill="#f3ead9"/>
      <circle cx="98" cy="9" r="12" fill="#f3ead9"/>
    </g>
    <g transform="translate(300,530)">
      <ellipse cx="0" cy="0" rx="42" ry="31" fill="url(#chick)"/>
      <rect x="30" y="-8" width="54" height="16" rx="8" fill="#f3ead9"/>
      <circle cx="88" cy="-8" r="11" fill="#f3ead9"/>
      <circle cx="88" cy="8" r="11" fill="#f3ead9"/>
    </g>
  </g>

  <!-- Plates of chicken breasts -->
  <g filter="url(#soft)">
    <ellipse cx="620" cy="640" rx="120" ry="52" fill="#ffffff"/>
    <ellipse cx="620" cy="634" rx="104" ry="42" fill="#eef7f1"/>
    <ellipse cx="590" cy="628" rx="46" ry="26" fill="#f0d3b0"/>
    <ellipse cx="662" cy="640" rx="46" ry="26" fill="#e7c39a"/>
  </g>
</svg>
